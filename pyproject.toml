[project]
name = "sjtu-suite"
version = "0.2.0"
description = "A collection of automation utilities for SJTU services"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.11.0",
    "click>=8.1.0",
    "flask>=3.1.1",
    "flask-cors>=6.0.0",
    "requests>=2.32.4",
    "rich>=13.0.0",
    "tzdata>=2025.2",
]

[project.scripts]
# Daemon entry points (long-running services)
sjtu-door = "daemons.door_server:main"
sjtu-checkin = "daemons.checkin_server:main"
# CLI entry points (interactive tools)
sjtu-pe = "sjtusuite.cli.pe:main"
sjtu-video = "sjtusuite.cli.video:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sjtusuite", "daemons"]

